spring.application.name=chinook-jpa-entity-generator
spring.main.web-application-type=none

# Database connection, override with environment variables if yours differ
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chinook}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Generator settings
generator.schema=public
